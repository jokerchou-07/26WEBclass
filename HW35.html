<!DOCTYPE html>
<html>
<head>
  <title>Profile Properties</title>
</head>
<body>

<h2>Before Deleting Age:</h2>
<div id="before"></div>

<h2>After Deleting Age:</h2>
<div id="after"></div>

<script>
  // Given object
  var Person = {
    firstName: "Tony",
    lastName: "Lee",
    age: 50,
    eyeColor: "Blue"
  };

  // Display properties before deletion
  let beforeOutput = "";
  for (let key in Person) {
    beforeOutput += key + ": " + Person[key] + "<br>";
  }
  document.getElementById("before").innerHTML = beforeOutput;

  // Delete age property
  delete Person.age;

  // Display properties after deletion
  let afterOutput = "";
  for (let key in Person) {
    afterOutput += key + ": " + Person[key] + "<br>";
  }
  document.getElementById("after").innerHTML = afterOutput;
</script>

</body>
</html>
