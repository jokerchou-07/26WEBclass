<!DOCTYPE html>
<html>
<head>
  <title>Object Properties Demo</title>
</head>
<body>

<h2>Object Properties Before Deletion:</h2>
<p id="before"></p>

<h2>Object Properties After Deletion:</h2>
<p id="after"></p>

<script>
  // Create object
  let person = {
    name: "John",
    age: 25,
    city: "New York"
  };

  // List properties before deletion
  let beforeText = "";
  for (let key in person) {
    beforeText += key + ": " + person[key] + "<br>";
  }
  document.getElementById("before").innerHTML = beforeText;

  // Delete age property
  delete person.age;

  // List properties after deletion
  let afterText = "";
  for (let key in person) {
    afterText += key + ": " + person[key] + "<br>";
  }
  document.getElementById("after").innerHTML = afterText;
</script>

</body>
</html>
