<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chou yi chen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        .output-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2f7;
            border-left: 5px solid #3498db;
            border-radius: 4px;
        }
        p {
            margin: 5px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Circle Calculator</h2>
    
    <label for="radiusInput">Enter Radius:</label>
    <input type="number" id="radiusInput" placeholder="e.g., 5" min="0" step="any">
    
    <button onclick="handleCalculation()">Calculate Properties</button>

    <div class="output-box">
        <p id="circumferenceOutput">The circumference is --</p>
        <p id="areaOutput">The area is --</p>
    </div>
</div>

<script>
    // 1. Function to calculate and display circumference
    function calcCircumfrence(radius) {
        // Circumference formula: 2 * pi * r
        const circumference = 2 * Math.PI * radius;
        
        // Format to 2 decimal places for better presentation
        const resultString = "The circumference is " + circumference.toFixed(2);
        
        // Update the web page
        document.getElementById("circumferenceOutput").innerText = resultString;
        
        // Also log to console as requested by standard function exercises
        console.log(resultString);
    }

    // 2. Function to calculate and display area
    function calcArea(radius) {
        // Area formula: pi * r^2
        const area = Math.PI * Math.pow(radius, 2);
        
        // Format to 2 decimal places
        const resultString = "The area is " + area.toFixed(2);
        
        // Update the web page
        document.getElementById("areaOutput").innerText = resultString;
        
        // Also log to console
        console.log(resultString);
    }

    // Helper function to bridge the button click with your required functions
    function handleCalculation() {
        const radiusValue = parseFloat(document.getElementById("radiusInput").value);
        
        if (isNaN(radiusValue) || radiusValue < 0) {
            alert("Please enter a valid positive number for the radius.");
            return;
        }

        // Triggering your required functions
        calcCircumfrence(radiusValue);
        calcArea(radiusValue);
    }
</script>

</body>
</html>
