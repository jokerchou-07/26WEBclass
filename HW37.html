<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>chou yi chen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input {
      margin: 10px 0;
      padding: 5px;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
    }
    #output {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Circle Properties Calculator</h1>
  <label for="radius">Enter radius:</label>
  <input type="number" id="radius" placeholder="e.g. 5">
  <br>
  <button onclick="calcCircumference()">Calculate Circumference</button>
  <button onclick="calcArea()">Calculate Area</button>

  <div id="output"></div>

  <script>
    function calcCircumference() {
      const radius = document.getElementById('radius').value;
      if (radius) {
        const circumference = 2 * Math.PI * radius;
        document.getElementById('output').innerText =
          "The circumference is " + circumference.toFixed(2);
      } else {
        document.getElementById('output').innerText = "Please enter a radius.";
      }
    }

    function calcArea() {
      const radius = document.getElementById('radius').value;
      if (radius) {
        const area = Math.PI * Math.pow(radius, 2);
        document.getElementById('output').innerText =
          "The area is " + area.toFixed(2);
      } else {
        document.getElementById('output').innerText = "Please enter a radius.";
      }
    }
  </script>
</body>
</html>
